plugins {
    id 'fabric-loom' version '1.8.9'
    id 'maven-publish'
}

version = project.hasProperty('mod_version') ? project.mod_version : '1.0.0'
group = project.hasProperty('maven_group') ? project.maven_group : 'com.example'

base {
    archivesName = project.hasProperty('archives_base_name') ? project.archives_base_name : 'autoschematicbuilder'
}

repositories {
    // Add repositories here if needed
}

dependencies {
    minecraft "com.mojang:minecraft:${project.hasProperty('minecraft_version') ? project.minecraft_version : '1.21.11'}"
    mappings "net.fabricmc:yarn:${project.hasProperty('yarn_mappings') ? project.yarn_mappings : '1.21.11+build.3'}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.hasProperty('loader_version') ? project.loader_version : '0.15.11'}"

    def fabricVersion = project.hasProperty('fabric_version') ? project.fabric_version : '0.97.8+1.21.11'
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
